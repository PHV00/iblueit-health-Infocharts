# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - iblueit-health-Infocharts

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22 for the legacy React frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # Temporary compatibility measure for React 16 and MUI 5.
      # This ignores incompatible peerDependency declarations; it is not a library upgrade.
      - name: Install legacy dependencies
        run: npm install --legacy-peer-deps

      # The original app imports _config.js, but only _config.template.js is tracked.
      - name: Prepare API configuration
        run: cp src/providers/_config.template.js src/providers/_config.js

      - name: Build production frontend for Azure
        env:
          CI: 'true'
          PUBLIC_URL: '/'
          REACT_APP_BASE_URL_I_BLUE_IT: ${{ vars.REACT_APP_BASE_URL_I_BLUE_IT }}
        run: |
          if [ -z "$REACT_APP_BASE_URL_I_BLUE_IT" ]; then
            echo "::error::Configure the repository Actions variable REACT_APP_BASE_URL_I_BLUE_IT with https://<BACKEND-HOST>/api"
            exit 1
          fi
          npm run build

      - name: Run non-interactive tests
        env:
          CI: 'true'
        run: npm run test -- --watchAll=false --passWithNoTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B7166FAAD3984C56857386372E97440E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12CFF9B06D364702A3059C05FAEE9266 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28ED665703DB47CCA84F2991597859A5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'iblueit-health-Infocharts'
          slot-name: 'Production'
          package: .
          
